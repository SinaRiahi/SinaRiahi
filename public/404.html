<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>404 // RESOURCE_NOT_FOUND</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // GitHub Pages SPA 404 handler:
    // If a visitor accesses an unresolved sub-route directly on GitHub Pages,
    // this preserves the route or loads the custom 404 arena.
    // If the hit was for the repository root or index, it redirects cleanly to the landing page.
    (function() {
      var path = window.location.pathname;
      var segments = path.split('/').filter(Boolean);
      var isGitHubPages = window.location.hostname.endsWith('github.io');
      var isRepoSubpath = segments.length > 0 && segments[0].toLowerCase() === 'sinariahi';

      var basePath = (isGitHubPages || isRepoSubpath) && segments.length > 0
        ? '/' + segments[0] + '/'
        : '/';

      // If user hit the repo root or root index, go straight to landing without #404
      if (segments.length === 0 || (segments.length === 1 && segments[0].toLowerCase() === 'sinariahi') || (segments.length === 1 && segments[0].toLowerCase() === 'index.html')) {
        window.location.replace(basePath);
        return;
      }

      // If hitting an unknown sub-path, route to #404
      window.location.replace(basePath + '#404');
    })();
  </script>
</head>
<body style="background:#08090D;color:#94a3b8;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
  <p>Redirecting to cyber sector 404...</p>
</body>
</html>
